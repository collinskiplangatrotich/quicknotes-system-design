```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes System - Frontend Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <h1>QuickNotes Client</h1>
      <p class="subtitle">API Integration & Prototype UI</p>
    </header>

    <!-- Global Controls & Action Section -->
    <section class="card controls-card">
      <div class="actions">
        <button id="load-btn" type="button" class="btn btn-primary">Load Notes</button>
      </div>
      <!-- Status Message Paragraph -->
      <p id="status" class="status-msg" aria-live="polite"></p>
    </section>

    <!-- Create Note Form -->
    <section class="card form-card">
      <h2>Create New Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Note Title <span class="required">*</span></label>
          <input 
            type="text" 
            id="title-input" 
            name="title" 
            placeholder="Enter title (max 100 characters)" 
            maxlength="100" 
            required
          >
          <small class="help-text">Required. Maximum 100 characters.</small>
        </div>

        <div class="form-group">
          <label for="body-input">Note Content</label>
          <textarea 
            id="body-input" 
            name="body" 
            rows="4" 
            placeholder="Enter note body details..."
          ></textarea>
        </div>

        <button id="submit-btn" type="submit" class="btn btn-success">Save Note</button>
      </form>
    </section>

    <!-- Notes List Section -->
    <section class="card list-card">
      <h2>Your Notes</h2>
      <ul id="notes-list" class="notes-list"></ul>
    </section>
  </main>

</body>
</html>
```
